<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>New York Outdoor Map</title>

  <link rel="manifest" href="./manifest.json">

  <link rel="apple-touch-icon" href="./icon-192.png">

  <meta name="theme-color" content="#2E8B57">

  <!-- Load the MapLibre CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@6.1.0/dist/maplibre-gl.css"
  >

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@maptiler/geocoding-control@2.1.7/style.css"
>

  <style>
    /*
      Remove the normal white border around the webpage.
    */
    body {
      margin: 0;
      padding: 0;
    }

    /*
      Make the page and map fill the whole browser window.
    */
    html,
    body,
    #map {
      width: 100%;
      height: 100%;
    }
      #legend {
  position: absolute;
  bottom: 30px;
  left: 20px;
  z-index: 10;

  background-color: rgb(106, 116, 198);
  padding: 12px 16px;
  border-radius: 8px;

  font-family: Arial, sans-serif;
  font-size: 14px;

  background: #f0f0bd;      /* Warm off-white */
  border: 2px solid #2E8B57; /* Forest green */
  color: #333333;
  border-radius: 12px; 

  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
}

#legend h3 {
  margin-top: 0;
  margin-bottom: 10px;
  font-size: 16px;
}

.legend-item {
  display: flex;
  align-items: center;
  margin-bottom: 7px;
}

.legend-color {
  width: 16px;
  height: 16px;
  margin-right: 8px;
  border-radius: 50%;
  border: 1px solid #555;
}

.campsite-color {
  background-color: #2e8b57;
}

.swimming-color {
  background-color: #2878b5;
}

.kayak-color {
  background-color: #e08b24;
}

.hiking-color {
  background-color: #8C5A3C;
}

.skiing-color {
  background-color: #7c55a5;
}

.ECP-color {
  background-color: #00afc1;
}

.SP-color {
  background-color: #d64545;
}

.XC-skiing-color {
  background-color: #E0A800;
}

.Waterfall-color {
  background-color: #D946A8;
}

.Snow_shoe-color {
  background-color: #0baa2d;
}

.Adventure_activity-color {
  background-color: #6B7280;
}

.MCP-color {
  background-color: #efe521;
}

.National_Park-color {
  background-color: #a76ad0;
}

/* CUSTOM MAP MARKERS */

.custom-marker {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid #333333;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;
}

.marker-center {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background-color: rgb(255, 255, 255);
}

.marker-center.visited {
    background-color: black;
}
/* Visited symbol shown in the map key */

.visited-example {
    width: 16px;
    height: 16px;
    margin-right: 8px;

    border-radius: 50%;
    border: 1px solid #555;
    background-color: white;

    position: relative;
    flex-shrink: 0;
}

.visited-example::after {
    content: "";

    width: 7px;
    height: 7px;

    background-color: black;
    border-radius: 50%;

    position: absolute;
    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);
}

.legend-divider {
    border-top: 1px solid #AAAAAA;
    margin: 10px 0;
}

@media (max-width: 600px) {

  #legend {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    width: 100%;
    max-height: 25vh;

    box-sizing: border-box;

    background-color: white;

    padding: 10px 14px;

    border-radius: 14px 14px 0 0;

    border: 1px solid #2E8B57;

    font-family: Arial, sans-serif;
    font-size: 11px;

    overflow-y: auto;

    z-index: 10;
  }

  #legend h3 {
    margin: 0 0 8px 0;
    font-size: 13px;
  }

  #legend .legend-items {
    display: grid;

    grid-template-columns: repeat(2, 1fr);

    column-gap: 14px;
    row-gap: 5px;
  }

  .legend-item {
    margin-bottom: 0;
    font-size: 11px;
  }

  .legend-color,
  .visited-example {
    width: 12px;
    height: 12px;
    margin-right: 6px;

    flex-shrink: 0;
  }

  .legend-divider {
    grid-column: 1 / -1;

    border-top: 1px solid #AAAAAA;

    margin: 4px 0;
  }
}
  </style>

</head>

<body>

  <!-- MapLibre places the map inside this element -->
<div id="map"></div>
<div id="legend">
  <h3>Map Key</h3>

  <div class="legend-items">

  <div class="legend-item">
    <span class="legend-color campsite-color"></span>
    Campsites
  </div>

  <div class="legend-item">
    <span class="legend-color swimming-color"></span>
    Swimming holes
  </div>

  <div class="legend-item">
    <span class="legend-color kayak-color"></span>
    Kayak launches
  </div>

  <div class="legend-item">
    <span class="legend-color hiking-color"></span>
    Hiking trails
  </div>

  <div class="legend-item">
    <span class="legend-color skiing-color"></span>
    Downhill Skiing
  </div>

  <div class="legend-item">
    <span class="legend-color SP-color"></span>
    State Park
  </div>
  
  <div class="legend-item">
    <span class="legend-color ECP-color"></span>
    Erie County Park
  </div>

  <div class="legend-item">
    <span class="legend-color XC-skiing-color"></span>
    Cross Country Skiing
  </div>

  <div class="legend-item">
    <span class="legend-color Waterfall-color"></span>
    Waterfall
  </div>

  <div class="legend-item">
    <span class="legend-color Adventure_activity-color"></span>
    Adventure activity
  </div>

  <div class="legend-item">
    <span class="legend-color Snow_shoe-color"></span>
    Snow shoe
  </div>

  <div class="legend-item">
    <span class="legend-color MCP-color"></span>
    Monroe County Park
  </div>

  <div class="legend-item">
    <span class="legend-color National_Park-color"></span>
    National Park
  </div>

  <div class="legend-divider"></div>

  <div class="legend-item">
    <span class="visited-example"></span>
    Visited
  </div>
  
 </div>

</div>
  <!--
    Version 6 of MapLibre must be loaded as a module.
  -->
  <script type="module">

    /*
      Import the MapLibre library.
    */
    import * as maplibregl from
      "https://unpkg.com/maplibre-gl@6.1.0/dist/maplibre-gl.mjs";

    import {
      GeocodingControl
    } from "https://cdn.jsdelivr.net/npm/@maptiler/geocoding-control@3/maplibregl/+esm"; 

    import { places } from "./places.js";

    const mapTilerKey = "uoXI4BPW3yTAen7xNVDd";

    /*
      Create the map.
    */
    const map = new maplibregl.Map({
      container: "map",

      /*
        Map style, from maptiler.
      */
      style: "https://api.maptiler.com/maps/outdoor-v4/style.json?key=uoXI4BPW3yTAen7xNVDd",
    

      /*
        Centred to Buffalo, NY.
        Coordinate order is longitude, latitude.
      */
      center: [-78.8784, 42.8864],

      /*
        Show most of New York State.
      */
      zoom: 6
    });

    /*
      Add the zoom and rotation controls.
    */
    map.addControl(
      new maplibregl.NavigationControl(),
      "top-right"
    );
    
    map.addControl(
      new GeocodingControl({
        apiKey: mapTilerKey,
        maplibregl: maplibregl,
        placeholder: "Search for a place"
      }),
      "top-left"
    );

    /*
    /*
  This is my list of places.
  Each pair of curly brackets = one location.
*/


/*
  Assign a color to each category. forest green #2E8B57, blue #2D7DD2, 
  orange #F28E2B, brown #8C5A3C, purple #7B5CD6, red #D64545, gold #E0A800,
   grey #6B7280, pink #D946A8, cyan #00AFC1
*/
const categoryColors = {
  Campsite: "#2e8b57",
  Swimming_spot: "#2878b5",
  Kayak_launch: "#e08b24",
  Downhill_skiing: "#7c55a5",
  State_Park: "#d64545",
  Erie_County_Park: "#00afc1",
  XC_Skiing: "#E0A800",
  Waterfall: "#D946A8",
  Snow_shoe: "#0baa2d",
  Adventure_activity: "#6B7280",
  Monroe_County_Park: "#efe521",
  National_Park: "#a76ad0"
};

/*
  Repeat the marker-building process
  once for every item in the places list.
*/
console.log("Places loaded:", places);
places.forEach(place => {

  // Create the colored outer circle
  const markerElement = document.createElement("div");

  markerElement.className = "custom-marker";

  markerElement.style.backgroundColor =
    categoryColors[place.category];


  // Create the small center circle
  const centerDot = document.createElement("div");

  centerDot.className = "marker-center";


  // If we have visited this place,
  // make the center dot black
  if (place.visited === true) {
    centerDot.classList.add("visited");
  }


  // Put the center dot inside the colored marker
  markerElement.appendChild(centerDot);


  // Add the completed marker to the map
  new maplibregl.Marker({
    element: markerElement
  })
    .setLngLat(place.coordinates)
    .setPopup(
  new maplibregl.Popup().setHTML(`
    <h3>${place.name}</h3>

    <p>
      <strong>Category:</strong>
      ${place.category}
    </p>

    <p>
      <strong>Visited:</strong>
      ${place.visited ? "Yes" : "No"}
    </p>

    <p>${place.description}</p>
  `)
)
    .addTo(map);

});

console.log("Reached service worker section");

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker
      .register("./service-worker.js")
      .then(registration => {
        console.log(
          "Service worker registered:",
          registration.scope
        );
      })
      .catch(error => {
        console.error(
          "Service worker registration failed:",
          error
        );
      });
  });
}
  </script>

</body>

</html>
