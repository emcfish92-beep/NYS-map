/* CUSTOM MAP MARKERS */

.custom-marker {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid #333333;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;
}

.custom-marker svg {
  width: 14px;
  height: 14px;

  stroke: white;

  stroke-width: 2.5;

  pointer-events: none;
}

.custom-marker.visited-marker svg {
  stroke: #1a1a1a;
  stroke-width: 3;
}

/* Visited symbol shown in the map key */

.visited-example {
    width: 16px;
    height: 16px;
    margin-right: 8px;

    border-radius: 50%;
    border: 1px solid #555;
    background-color: white;

    position: relative;
    flex-shrink: 0;
}

.visited-example::after {
    content: "";

    width: 7px;
    height: 7px;

    background-color: black;
    border-radius: 50%;

    position: absolute;
    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);
}

@media (max-width: 600px) {

  /* =========================
     SLIDING MOBILE LEGEND
     ========================= */

  #legend {
    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    width: 100%;

    box-sizing: border-box;

    background-color: #1C1C1E;
    color: white;

    border: none;
    border-radius: 22px 22px 0 0;

    padding: 0;

    z-index: 1000;

    max-height: 65vh;

    overflow: hidden;

    /* Keep only the top 64px visible when closed */
    transform: translateY(calc(100% - 64px));

    transition: transform 0.3s ease;
  }


  /* This class is added by JavaScript when open */
  #legend.open {
    transform: translateY(0);
  }


  /* =========================
     DRAG / TITLE AREA
     ========================= */

  #legend-handle {
    height: 64px;

    box-sizing: border-box;

    padding: 7px 18px 10px 18px;

    cursor: grab;

    user-select: none;
    touch-action: none;

  <script type="module">

    /*
      Import the MapLibre library.
    */
    import * as maplibregl from
      "https://unpkg.com/maplibre-gl@6.1.0/dist/maplibre-gl.mjs";

    import {
      GeocodingControl
    } from "https://cdn.jsdelivr.net/npm/@maptiler/geocoding-control@3/maplibregl/+esm"; 

    import { places } from "./places.js";

    const mapTilerKey = "uoXI4BPW3yTAen7xNVDd";

    /*
      Create the map.
    */
    const map = new maplibregl.Map({
      container: "map",

      /*
        Map style, from maptiler.
      */
      style: "https://api.maptiler.com/maps/01a0597a-409a-7b37-88a4-7ab95e87b815/style.json?key=uoXI4BPW3yTAen7xNVDd",
    

      /*
        Centred to Buffalo, NY.
        Coordinate order is longitude, latitude.
      */
      center: [-78.8784, 42.8864],

      /*
        Show most of New York State.
      */
      zoom: 6
    });

    /*
      Add the zoom and rotation controls.
    */
    map.addControl(
      new maplibregl.NavigationControl(),
      "top-right"
    );

    map.addControl(
      new maplibregl.ScaleControl({
        maxWidth: 100,
        unit: "metric"
      }),
      "bottom-right"
    );
    
    

    /*
    /*
  This is my list of places.
  Each pair of curly brackets = one location.
*/


/*
  Assign a color to each category. forest green #2E8B57, blue #2D7DD2, 
  orange #F28E2B, brown #8C5A3C, purple #7B5CD6, red #D64545, gold #E0A800,
   grey #6B7280, pink #D946A8, cyan #00AFC1
*/
const categoryColors = {
  Campsite: "#2e8b57",
  Swimming_Spot: "#2878b5",
  Kayak_Launch: "#e08b24",
  Downhill_Skiing: "#7c55a5",
  State_Park: "#d64545",
  Erie_County_Park: "#00afc1",
  XC_Skiing: "#ceb361",
  Waterfall: "#efe521",
  Snow_Shoe: "#0baa2d",
  Adventure_Activity: "#6B7280",
  Monroe_County_Park: "#D946A8",
  National_Park: "#a76ad0",
  Hiking_Spot: "#8C5A3C",
  National_Forest: "#629de6",
  Cave: "#220634",
  Natural_Monument: "#cb2a6d",
  Non_Outdoor_Cool_Thing: "#b7c16d",
  Lake: "#098b7c"
};

const categoryIcons = {
  Campsite: "tent",
  Swimming_Spot: "waves-ladder",
  Kayak_Launch: "kayak",
  Downhill_Skiing: "cable-car",
  State_Park: "trees",
  Erie_County_Park: "shrub",
  XC_Skiing: "cloud-snow",
  Waterfall: "zodiac-aquarius",
  Snow_Shoe: "snowflake",
  Adventure_Activity: "tent-tree",
  Monroe_County_Park: "pentagon",
  National_Park: "binoculars",
  Hiking_Spot: "mountain",
  National_Forest: "tree-pine",
  Cave: "flashlight",
  Natural_Monument: "shell",
  Non_Outdoor_Cool_Thing: "fan",
  Lake: "droplets"
};


/*
  Repeat the marker-building process
  once for every item in the places list.
*/
console.log("Places loaded:", places);

const placeMarkers = new Map();

places.forEach(place => {

  // Create the colored outer circle
  const markerElement = document.createElement("div");

  markerElement.className = "custom-marker";

  // Add white ring if this place has been visited
  if (place.visited === true) {
    markerElement.classList.add("visited-marker");
  }

  // Give the marker its category color
  markerElement.style.backgroundColor =
    categoryColors[place.category];

  // Create the Lucide icon
  const markerIcon = document.createElement("i");

  markerIcon.setAttribute(
    "data-lucide",
    categoryIcons[place.category]
  );

  markerElement.appendChild(markerIcon);


  // Add the completed marker to the map
  const marker = new maplibregl.Marker({
    element: markerElement
  })
    .setLngLat(place.coordinates)

    .setPopup(
      new maplibregl.Popup({
        maxWidth: "320px"
      }).setHTML(`

        ${
          place.photos && place.photos.length > 0
            ? `
              <div class="popup-gallery">

                ${place.photos
                  .map(
                    photo => `
                      <img
                        src="${photo}"
                        class="popup-photo"
                        alt="${place.name}"
                      >
                    `
                  )
                  .join("")}

              </div>
            `
            : ""
        }

        <div class="popup-content">

          <h3>${place.name}</h3>

          <p>
            <strong>Category:</strong>
            ${place.category.replaceAll("_", " ")}
          </p>

          <p>
            <strong>Visited:</strong>
            ${place.visited ? "Yes" : "No"}
          </p>

          <p>${place.description}</p>

        </div>

      `)
    )

    .addTo(map);

  placeMarkers.set(place.name, marker);

});

lucide.createIcons();

/* --------------------------------------------------
   SEARCH BAR - searches only places in places.js
-------------------------------------------------- */

class PlaceSearchControl {

  onAdd(map) {

    this.map = map;

    this.container = document.createElement("div");
    this.container.className =
      "maplibregl-ctrl maplibregl-ctrl-group place-search-control";

    this.searchBox = document.createElement("div");
    this.searchBox.className = "place-search-box";

    this.searchIcon = document.createElement("span");
    this.searchIcon.className = "place-search-icon";
    this.searchIcon.innerHTML = "⌕";

    this.input = document.createElement("input");
    this.input.type = "text";
    this.input.placeholder = "Search my places";
    this.input.autocomplete = "off";

    this.results = document.createElement("div");
    this.results.className = "place-search-results";

    this.searchBox.appendChild(this.searchIcon);
    this.searchBox.appendChild(this.input);

    this.container.appendChild(this.searchBox);
    this.container.appendChild(this.results);


    /* Search while typing */

    this.input.addEventListener("input", () => {

      const searchText =
        this.input.value.trim().toLowerCase();

      this.results.innerHTML = "";

      if (searchText.length === 0) {
        this.results.style.display = "none";
        return;
      }


      /* Search name, category and description */

      const matches = places.filter(place => {

        const name =
          place.name.toLowerCase();

        const category =
          place.category
            .replaceAll("_", " ")
            .toLowerCase();

        const description =
          place.description
            ? place.description.toLowerCase()
            : "";

        return (
          name.includes(searchText) ||
          category.includes(searchText) ||
          description.includes(searchText)
        );

      });


      if (matches.length === 0) {

        const noResult =
          document.createElement("div");

        noResult.className =
          "place-search-no-result";

        noResult.textContent =
          "No places found";

        this.results.appendChild(noResult);

        this.results.style.display = "block";

        return;
      }


      matches.forEach(place => {

        const result =
          document.createElement("button");

        result.type = "button";
        result.className =
          "place-search-result";


        const placeName =
          document.createElement("span");

        placeName.className =
          "place-search-result-name";

        placeName.textContent =
          place.name;


        const placeCategory =
          document.createElement("span");

        placeCategory.className =
          "place-search-result-category";

        placeCategory.textContent =
          place.category.replaceAll("_", " ");


        result.appendChild(placeName);
        result.appendChild(placeCategory);


        /* What happens when a result is clicked */

        result.addEventListener("click", () => {

          this.input.value = place.name;

          this.results.style.display = "none";


          /* Close any popup already open */

          document
            .querySelectorAll(".maplibregl-popup")
            .forEach(popup => popup.remove());


          /* Smoothly zoom to selected place */

          map.flyTo({
            center: place.coordinates,
            zoom: 14,
            duration: 1500,
            essential: true
          });


          /* Find its marker */

          const marker =
            placeMarkers.get(place.name);


          /* Open popup when zoom finishes */

          map.once("moveend", () => {

            if (marker) {

              marker.togglePopup();

            }

          });

        });


        this.results.appendChild(result);

      });


      this.results.style.display = "block";

    });


    /* Stop map dragging when using search */

    this.container.addEventListener(
      "mousedown",
      event => event.stopPropagation()
    );

    this.container.addEventListener(
      "touchstart",
      event => event.stopPropagation()
    );


    return this.container;

  }


  onRemove() {

    this.container.remove();

    this.map = undefined;

  }

}


/* Add search bar to upper-left corner */

map.addControl(
  new PlaceSearchControl(),
  "top-left"
);

console.log("Reached service worker section");

/* =========================
   MOBILE SLIDING LEGEND
   ========================= */

const legend = document.getElementById("legend");
const legendHandle = document.getElementById("legend-handle");

let legendDragging = false;
let legendStartY = 0;
let legendStartTranslate = 0;


function getLegendClosedPosition() {

  const legendHeight = legend.offsetHeight;
  const handleHeight = legendHandle.offsetHeight;

  return legendHeight - handleHeight;
}


function openLegend() {

  legend.classList.add("open");

  legend.style.transform = "translateY(0px)";
}


function closeLegend() {

  legend.classList.remove("open");

  legend.style.transform = "";
}


function toggleLegend() {

  if (legend.classList.contains("open")) {

    closeLegend();

  } else {

    openLegend();

  }
}


legendHandle.addEventListener("pointerdown", event => {

  legendDragging = true;

  legendStartY = event.clientY;

  const closedPosition = getLegendClosedPosition();

  legendStartTranslate =
    legend.classList.contains("open")
      ? 0
      : closedPosition;

  legend.style.transition = "none";

  legendHandle.setPointerCapture(event.pointerId);
});


legendHandle.addEventListener("pointermove", event => {

  if (!legendDragging) {
    return;
  }

  const movement = event.clientY - legendStartY;

  const closedPosition = getLegendClosedPosition();

  let newPosition =
    legendStartTranslate + movement;


  if (newPosition < 0) {
    newPosition = 0;
  }


  if (newPosition > closedPosition) {
    newPosition = closedPosition;
  }


  legend.style.transform =
    `translateY(${newPosition}px)`;
});


legendHandle.addEventListener("pointerup", event => {

  if (!legendDragging) {
    return;
  }

  legendDragging = false;

  legend.style.transition =
    "transform 0.3s ease";


  const movement =
    event.clientY - legendStartY;


  if (Math.abs(movement) < 10) {

    toggleLegend();

    return;
  }


  if (movement < 0) {

    openLegend();

  } else {

    closeLegend();

  }

});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker
      .register("./service-worker.js")
      .then(registration => {
        console.log(
          "Service worker registered:",
          registration.scope
        );
      })
      .catch(error => {
        console.error(
          "Service worker registration failed:",
          error
        );
      });
  });
}
  </script>
