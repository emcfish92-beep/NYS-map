    /*
      Remove the normal white border around the webpage.
    */

      Make the page and map fill the whole browser window.

      #legend {
  position: absolute;
  bottom: 30px;
  left: 20px;
  z-index: 10;

  border-radius: 8px;

}

#legend h3 {
  margin-top: 0;

  font-size: 16px;
}

.legend-item {

  align-items: center;

.legend-color {

  height: 16px;

.MCP-color {

}

.National_Park-color {

}

/* CUSTOM MAP MARKERS */

.custom-marker {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid #333333;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;
}

.marker-center {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background-color: rgb(255, 255, 255);
}

.marker-center.visited {
    background-color: black;
}
/* Visited symbol shown in the map key */

.visited-example {
    width: 16px;
    height: 16px;
    margin-right: 8px;

    border-radius: 50%;
    border: 1px solid #555;
    background-color: white;

    position: relative;
    flex-shrink: 0;
}

.visited-example::after {
    content: "";

    width: 7px;
    height: 7px;

    background-color: black;
    border-radius: 50%;

    position: absolute;
    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);
}

.legend-divider {
    border-top: 1px solid #AAAAAA;
    margin: 10px 0;
}

    /*
      Add the zoom and rotation controls.
    */
    map.addControl(

    map.addControl(
      new GeocodingControl({
        apiKey: mapTilerKey,

/*
  Assign a color to each category. forest green #2E8B57, blue #2D7DD2, 
  orange #F28E2B, brown #8C5A3C, purple #7B5CD6, red #D64545, gold #E0A800,
   grey #6B7280, pink #D946A8, cyan #00AFC1
*/
const categoryColors = {
  Campsite: "#2e8b57",
  Swimming_spot: "#2878b5",
  Kayak_launch: "#e08b24",
  Downhill_skiing: "#7c55a5",
  State_Park: "#d64545",
  Erie_County_Park: "#00afc1",
  XC_Skiing: "#E0A800",
  Waterfall: "#D946A8",
  Snow_shoe: "#0baa2d",
  Adventure_activity: "#6B7280",
  Monroe_County_Park: "#efe521",
  National_Park: "#a76ad0"
};

/*
  Repeat the marker-building process
  once for every item in the places list.
*/
places.forEach(place => {

  // Create the colored outer circle
  const markerElement = document.createElement("div");

  markerElement.className = "custom-marker";

  markerElement.style.backgroundColor =
    categoryColors[place.category];


  // Create the small center circle
  const centerDot = document.createElement("div");

  centerDot.className = "marker-center";


  // If we have visited this place,
  // make the center dot black
  if (place.visited === true) {
    centerDot.classList.add("visited");
  }


  // Put the center dot inside the colored marker
  markerElement.appendChild(centerDot);


  // Add the completed marker to the map
  new maplibregl.Marker({
    element: markerElement
  })
    .setLngLat(place.coordinates)
    .setPopup(
  new maplibregl.Popup().setHTML(`
    <h3>${place.name}</h3>

    <p>
      <strong>Category:</strong>
      ${place.category}
    </p>

    <p>
      <strong>Visited:</strong>
      ${place.visited ? "Yes" : "No"}
    </p>

    <p>${place.description}</p>
  `)
)

});

console.log("Reached service worker section");

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker
      .register("./service-worker.js")
      .then(registration => {
        console.log(
          "Service worker registered:",
          registration.scope
        );
      })
      .catch(error => {
        console.error(
          "Service worker registration failed:",
          error
        );
      });
  });
